name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 已为最新版（支持 Node24）
      - uses: actions/checkout@v5

      # 最新版，支持 Node24
      - uses: pnpm/action-setup@v4
        with:
          version: 8

      # 🔥 关键升级：v4 → v5（官方支持 Node24 的版本）
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm docs:build

      # 🔥 升级：v3 → v4（支持 Node24）
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 🔥 升级：v4 → v5（支持 Node24）
      - uses: actions/deploy-pages@v5